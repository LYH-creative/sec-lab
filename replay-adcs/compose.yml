name: replay-adcs

services:
  web:
    build: .
    image: sec-lab/replay-adcs:1.0
    container_name: replay-adcs
    ports:
      - "127.0.0.1:8910:8080"
    environment:
      LAB_PORT: "8080"
      LAB_FLAG_DIR: /flags
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./flags:/flags:ro
    restart: unless-stopped
