# 靶场专用 redis 配置：故意还原「裸奔 Redis」的样子
#
# 三个要点，改之前先看：
#   1. bind 0.0.0.0 + protected-mode no —— 裸奔 Redis 的典型配置。
#      只靠 compose 的 127.0.0.1:16379 把危险面收在本机。
#   2. enable-protected-configs yes —— Redis 7 默认把 dir / dbfilename
#      列进 protected config，禁止运行时 CONFIG SET。真实环境里老版本
#      （<=6）没这个限制，所以这里把老行为还原回来，L2 才有得打。
#   3. save 关掉 —— 避免后台自动落盘在 /data 生成 dump.rdb 干扰练习。

bind 0.0.0.0
protected-mode no
port 6379
daemonize no

dir /data
dbfilename dump.rdb
save ""
appendonly no

enable-protected-configs yes

# 不设 requirepass，也不设 rename-command —— 未授权访问的现场
loglevel notice
